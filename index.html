<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WE Wedding - 1003</title>
    <!-- 引入 Google Fonts 優雅字體 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Cormorant Garamond"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- 轉場圖片 -->
    <div class="video-intro" id="videoIntro">
      <video id="introVideo" autoplay muted playsinline>
        <source src="./img/openner.mp4" type="video/mp4" />
      </video>
      <div class="skip-hint">點擊任意地方進入...</div>
    </div>

    <div class="main-content" id="mainContent">
      <!-- 1. 封面大圖 -->

      <section class="hero">
        <div class="hero-content">
          <h1>Wen & Eason's Wedding</h1>
        </div>
        <div
          id="carouselExampleIndicators"
          class="carousel slide"
          data-bs-ride="carousel"
        >
          <div class="carousel-indicators">
            <button
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="0"
              class="active"
              aria-current="true"
              aria-label="Slide 1"
            ></button>
            <button
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="1"
              aria-label="Slide 2"
            ></button>
            <button
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="2"
              aria-label="Slide 3"
            ></button>
          </div>
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img
                src="./img/Wedding_pic/1.jpg"
                class="carousel-collection"
                alt="..."
              />
            </div>
            <div class="carousel-item">
              <img
                src="./img/Wedding_pic/2.jpg"
                class="carousel-collection"
                alt="..."
              />
            </div>
            <div class="carousel-item">
              <img
                src="./img/Wedding_pic/3.jpg"
                class="carousel-collection"
                alt="..."
              />
            </div>
          </div>

          <div class="carousel-inner-phone"></div>
          <div class="carousel-control">
            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide="prev"
            >
              <span
                class="carousel-control-prev-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide="next"
            >
              <span
                class="carousel-control-next-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </div>
      </section>

      <section class="index">
        <div class="container">
          <div class="row g-4">
            <!-- 交通資訊 -->
            <div class="col-md-4">
              <div class="info-card">
                <img src="./img/icon/Commute.png" alt="" />
                <h2>
                  <a href="#commute-info" class="btn btn-outline-dark"
                    >交通資訊</a
                  >
                </h2>
                <p>Transportation</p>
              </div>
            </div>

            <!-- 座位資訊 -->
            <div class="col-md-4">
              <div class="info-card">
                <img src="./img/icon/Seat.png" alt="" />
                <h2>
                  <a href="#seat-map-info" class="btn btn-outline-dark"
                    >座位資訊</a
                  >
                </h2>
                <p>Seating Information</p>
              </div>
            </div>

            <!-- 流程表 -->
            <div class="col-md-4">
              <div class="info-card">
                <img src="./img/icon/Schedule.png" alt="" />
                <h2>
                  <a href="#wedding-info" class="btn btn-outline-dark"
                    >流程表</a
                  >
                </h2>
                <p>Wedding Schedule</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 2. 婚宴時間與地點 -->
      <section class="section">
        <div class="seat-map">
          <h2 class="section-title" id="seat-map-info">座位查詢</h2>
          <div class="row g-4">
            <!-- 左邊搜尋 -->
            <div class="col-md-5 search-section">
              <h3>請輸入您的姓名</h3>

              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="請輸入我們平常對你的稱呼..."
              />

              <div id="result">
                <p></p>
              </div>
              <div id="fixed-map">
                <img src="./img/Table_layout.png" alt="" />
                <div class="remark">*如天候不佳將調整為室內座位</div>
              </div>
            </div>

            <!-- 右邊結果 -->
            <div class="col-md-7 map-box">
              <div id="map-container"></div>
            </div>
          </div>
        </div>
      </section>
      <section class="section">
        <h2 class="section-title" id="wedding-info">Wedding Info</h2>
        <div style="margin-bottom: 50px">
          <img src="./img/invitation_front.svg" alt="" />
        </div>

        <div class="commute">
          <h2 class="section-title" id="commute-info">交通資訊</h2>

          <a href="https://maps.app.goo.gl/QbKGJyKKukXjHjaq5" target="_blank">
            <img
              style="max-width: 800px; width: 100%; height: auto"
              src="./img/location.jpg"
              alt=""
            />
          </a>

          <div class="map">
            📍<a
              href="https://maps.app.goo.gl/QbKGJyKKukXjHjaq5"
              target="_blank"
              >點我前往Google Map
            </a>
          </div>
        </div>

        <div class="end-section">期待與你相見</div>
      </section>

      <!-- 頁尾 -->
      <section>
        <footer>
          <p>Thank you for being a part of our lives.</p>
          <p>© 2026 Wen & Eason's wedding.</p>
        </footer>
      </section>
    </div>
  </body>

  <script src="./script.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
    crossorigin="anonymous"
  ></script>
</html>
